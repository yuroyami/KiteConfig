product: jvm/amper-plugin

description: Generates KiteBuildConfig, syncs the Xcode project, and checks the Android settings of a Kotlin Toolchain project.

# The KiteConfig plugin jar carries the shared KiteConfig code and declares no dependencies.
# In your own project, use the released version and the Gradle Plugin Portal instead:
#   repositories: [ { id: gradlePluginPortal, url: https://plugins.gradle.org/m2 } ]
#   dependencies: [ io.github.yuroyami:kiteconfig:<released version> ]
repositories:
  - mavenLocal

dependencies:
  - io.github.yuroyami:kiteconfig:0.0.0-dev

settings:
  kotlin:
    optIns: [ io.github.yuroyami.kiteconfig.core.InternalKiteCoreApi ]

pluginInfo:
  settingsClass: io.github.yuroyami.kiteconfig.toolchain.KiteConfigSettings
