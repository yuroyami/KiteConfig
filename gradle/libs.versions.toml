[versions]
# Kept in lockstep with the KiteCore runtime sibling (kotlin 2.4.0 / agp 9.2.1)
# and the actual consumer stack (syncplay/Jetzy on 2.4) — these are the KGP/AGP
# APIs the plugin compiles its injectors against (compileOnly; consumers supply
# their own at runtime).
agp = "9.2.1"
kotlin = "2.4.0"
junit = "5.11.4"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }
