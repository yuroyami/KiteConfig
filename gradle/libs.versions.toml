[versions]
# Compile against the upper supported AGP 9.3 line. Both dependencies are
# compileOnly: consumers supply a matrix-tested compatible implementation.
agp = "9.3.1"
agp-floor = "8.5.2"
kotlin = "2.4.10"
compose = "1.12.0-rc01"
junit = "5.11.4"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
android-gradle-api-floor = { module = "com.android.tools.build:gradle-api", version.ref = "agp-floor" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }
